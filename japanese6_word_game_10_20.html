<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일본어 6단원 단어 게임</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#202633;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 5px 20px #0001}
.hidden{display:none!important}.primary,.next,.choice{border:0;border-radius:12px;padding:13px 18px;cursor:pointer;font-size:17px}
.primary{background:#3b63f3;color:#fff}.next{width:100%;margin-top:16px;background:#18a566;color:#fff;font-weight:bold}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:17px}
.lengths{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}.choice{background:#eef1f8;text-align:center;padding:22px}.choice strong{display:block;font-size:28px;margin-bottom:6px}.choice.selected{background:#3b63f3;color:#fff}
.top{display:flex;justify-content:space-between}.progress{height:10px;background:#e8ebf2;border-radius:10px;margin:15px 0;overflow:hidden}.bar{height:100%;background:#3b63f3;width:0}
.type{text-align:center;font-weight:bold;color:#5263a7}.q{font-size:30px;font-weight:bold;text-align:center;padding:30px 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opts button{background:#f0f3f8;border:0;border-radius:12px;padding:14px;font-size:17px;text-align:left}
.correct{background:#dff6e8!important}.wrong{background:#ffe0e0!important}.feedback{margin-top:15px;padding:14px;border-radius:12px;text-align:center;font-weight:bold;background:#f5f6fa}
.score{font-size:38px;font-weight:bold}.tag{display:inline-block;background:#eef1ff;padding:6px 9px;border-radius:99px;margin:3px}
@media(max-width:600px){.opts,.lengths{grid-template-columns:1fr}.q{font-size:25px}}
</style></head><body><div class="wrap">

<div id="start" class="card">
<h1>🎌 일본어 6단원 단어 게임</h1>
<p>이름을 입력하고 문제 수를 선택하세요.</p>
<input id="studentName" placeholder="이름 입력">
<div class="lengths">
<button id="len10" class="choice" onclick="chooseLength(10)"><strong>10문제</strong>빠르게 도전!</button>
<button id="len20" class="choice" onclick="chooseLength(20)"><strong>20문제</strong>꼼꼼하게 도전!</button>
</div>
<p id="selectedInfo">문제 수를 선택해주세요.</p>
<button class="primary" style="width:100%" onclick="beginGame()">게임 시작</button>
</div>

<div id="game" class="card hidden">
<div class="top"><b id="nameLabel"></b><span id="num"></span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="type" class="type"></div><div id="question" class="q"></div>
<div id="options" class="opts"></div><div id="feedback" class="feedback hidden"></div>
<button id="next" class="next hidden" onclick="nextQuestion()">다음 문제 →</button>
</div>

<div id="finish" class="card hidden">
<h1>🎉 게임 완료!</h1><div id="finalName"></div><div id="finalScore" class="score"></div>
<div id="review"></div>
<button class="primary" style="width:100%;margin-top:15px" onclick="location.reload()">다시 하기</button>
</div>

</div><script>
const DATA={"vocab": [{"jp": "会う", "kana": "あう", "meaning": "만나다"}, {"jp": "あそぶ", "kana": "あそぶ", "meaning": "놀다"}, {"jp": "作る", "kana": "つくる", "meaning": "만들다"}, {"jp": "来る", "kana": "くる", "meaning": "오다"}, {"jp": "する", "kana": "する", "meaning": "하다"}, {"jp": "読む", "kana": "よむ", "meaning": "읽다"}, {"jp": "行く", "kana": "いく", "meaning": "가다"}, {"jp": "話す", "kana": "はなす", "meaning": "이야기하다"}, {"jp": "食べる", "kana": "たべる", "meaning": "먹다"}, {"jp": "見る", "kana": "みる", "meaning": "보다"}, {"jp": "およぐ", "kana": "およぐ", "meaning": "수영하다"}, {"jp": "待つ", "kana": "まつ", "meaning": "기다리다"}, {"jp": "死ぬ", "kana": "しぬ", "meaning": "죽다"}, {"jp": "帰る", "kana": "かえる", "meaning": "돌아가다/돌아오다"}, {"jp": "歌う", "kana": "うたう", "meaning": "노래하다"}, {"jp": "書く", "kana": "かく", "meaning": "쓰다"}, {"jp": "休む", "kana": "やすむ", "meaning": "쉬다"}, {"jp": "のる", "kana": "のる", "meaning": "타다"}, {"jp": "ねる", "kana": "ねる", "meaning": "자다"}, {"jp": "使う", "kana": "つかう", "meaning": "사용하다"}, {"jp": "借りる", "kana": "かりる", "meaning": "빌리다"}, {"jp": "できる", "kana": "できる", "meaning": "할 수 있다"}, {"jp": "とる", "kana": "とる", "meaning": "(사진 등을) 찍다"}, {"jp": "なる", "kana": "なる", "meaning": "되다"}]};
let qs=[],idx=0,score=0,wrong=[],locked=false,student="",questionCount=0;

function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function chooseLength(n){
 questionCount=n;
 document.getElementById("len10").classList.toggle("selected",n===10);
 document.getElementById("len20").classList.toggle("selected",n===20);
 document.getElementById("selectedInfo").textContent=n+"문제를 선택했습니다.";
}
function beginGame(){
 student=document.getElementById("studentName").value.trim();
 if(!student){alert("이름을 입력해주세요.");return;}
 if(!questionCount){alert("10문제 또는 20문제를 먼저 선택해주세요.");return;}
 const meaningCount=questionCount/2;
 const m=shuffle(DATA.vocab).slice(0,meaningCount).map(v=>({type:"meaning",v}));
 const r=shuffle(DATA.vocab).slice(0,meaningCount).map(v=>({type:"reading",v}));
 qs=shuffle(m.concat(r));idx=0;score=0;wrong=[];
 document.getElementById("start").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 document.getElementById("nameLabel").textContent=student;showQuestion();
}
function showQuestion(){
 locked=false;document.getElementById("feedback").classList.add("hidden");document.getElementById("next").classList.add("hidden");
 const q=qs[idx],v=q.v,correct=q.type==="meaning"?v.meaning:v.kana;
 document.getElementById("num").textContent=(idx+1)+" / "+qs.length;
 document.getElementById("bar").style.width=((idx/qs.length)*100)+"%";
 document.getElementById("type").textContent=q.type==="meaning"?"뜻 맞히기":"히라가나 읽기";
 document.getElementById("question").textContent=q.type==="meaning"?v.kana:(v.jp+" → 히라가나로 읽으면?");
 const candidates=shuffle(DATA.vocab.filter(x=>x.kana!==v.kana)).slice(0,3).map(x=>q.type==="meaning"?x.meaning:x.kana);
 const opts=shuffle([correct,...candidates]);
 document.getElementById("options").innerHTML=opts.map(o=>'<button data-answer="'+encodeURIComponent(o)+'" onclick="answer(this)">'+escapeHtml(o)+'</button>').join("");
}
function answer(btn){
 if(locked)return;locked=true;
 const chosen=decodeURIComponent(btn.dataset.answer),q=qs[idx],v=q.v,correct=q.type==="meaning"?v.meaning:v.kana;
 document.querySelectorAll("#options button").forEach(b=>b.disabled=true);
 const ok=chosen===correct;btn.classList.add(ok?"correct":"wrong");
 if(ok){score+=100/questionCount;showFeedback("⭕ 정답!");}
 else{wrong.push(v);document.querySelectorAll("#options button").forEach(b=>{if(decodeURIComponent(b.dataset.answer)===correct)b.classList.add("correct")});showFeedback("❌ 오답! 정답: "+correct);}
 document.getElementById("next").textContent=idx===qs.length-1?"결과 보기 →":"다음 문제 →";
 document.getElementById("next").classList.remove("hidden");
}
function showFeedback(t){const f=document.getElementById("feedback");f.textContent=t;f.classList.remove("hidden");}
function nextQuestion(){if(!locked)return;if(idx>=qs.length-1){finishGame();return;}idx++;showQuestion();window.scrollTo({top:0,behavior:"smooth"});}
function finishGame(){
 document.getElementById("game").classList.add("hidden");document.getElementById("finish").classList.remove("hidden");
 document.getElementById("finalName").textContent=student;
 document.getElementById("finalScore").textContent=Math.round(score)+"점 / 100점 ("+questionCount+"문제)";
 document.getElementById("review").innerHTML=wrong.length?"<p>복습할 단어</p>"+wrong.map(v=>'<span class="tag">'+escapeHtml(v.kana)+" = "+escapeHtml(v.meaning)+"</span>").join(""):"<p>🌟 전 문항 정답입니다!</p>";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
</script></body></html>
